apiVersion: operator.zuul-ci.org/v1alpha2
kind: Zuul
metadata:
  name: zuul
  namespace: zuul-system
spec:
  # Image configuration
  # Personal Zuul fork built from feature/tenant-scoped-dependencies.
  imagePrefix: ghcr.io/seanmooney
  zuulImageVersion: "41a882b"

  # External database
  database:
    secretName: zuul-db-uri

  # External ZooKeeper with TLS
  zookeeper:
    hosts: zookeeper.zookeeper-system.svc.cluster.local:2281
    secretName: zookeeper-client-tls

  # Scheduler - single replica for homelab
  scheduler:
    count: 1
    config:
      secretName: zuul-tenant-config

  # Web UI - single replica
  web:
    count: 1
    status_url: https://zuul.teim.app

  # Executor - single replica
  executor:
    count: 1
    sshkey:
      secretName: executor-sshkey

  # Merger - single replica
  merger:
    count: 1

  # Nodepool launcher
  launcher:
    config:
      secretName: nodepool-config

  # Source code connections
  connections:
    opendev:
      driver: gerrit
      server: review.opendev.org
      canonical_hostname: opendev.org
      secretName: gerrit-connection
    github:
      driver: github
      secretName: github-connection
      app_name: ci-sean-mooney-zuul
    github-readonly:
      # Dependency-only public repositories which do not need GitHub API
      # access or webhook events.
      driver: git
      baseurl: https://github.com
      # Keep this distinct from the API-backed GitHub connection so Zuul does
      # not deduplicate these projects onto that connection by canonical name.
      canonical_hostname: github-readonly
      # Explicitly record the default to roll pods after connection-secret
      # changes; the operator hashes connection configuration, not secrets.
      poll_delay: 7200
